<div class="flex flex-col gap-5 mb-12 sm:mb-16" [ngClass]="alignClass">
  @if (eyebrow) {
    <p class="section-eyebrow">{{ eyebrow }}</p>
  }

  <h2
    class="font-display text-[clamp(1.75rem,6vw,2.25rem)] sm:text-[2.5rem] md:text-[2.75rem] text-[var(--ink)] leading-[1.1] max-w-4xl [overflow-wrap:anywhere] sm:[overflow-wrap:normal] [text-wrap:balance]"
    style="font-weight: 600; letter-spacing: -0.03em"
    >
    <span>{{ title }}</span>
    @if (highlight) {
      {{ ' ' }}<span class="text-[var(--muted)]">{{ highlight }}</span>
    }
  </h2>

  @if (subtitle) {
    <p class="text-[var(--muted)] max-w-2xl leading-relaxed text-[1.05rem] sm:text-lg">
      {{ subtitle }}
    </p>
  }
</div>
