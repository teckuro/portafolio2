<div class="flex flex-col gap-5 mb-12 sm:mb-16" [ngClass]="alignClass">
  @if (eyebrow) {
    <p class="section-eyebrow">{{ eyebrow }}</p>
  }

  <h2
    class="font-display text-[clamp(1.25rem,6.4vw,2rem)] sm:text-5xl md:text-[3.25rem] tracking-tight text-[var(--ink)] leading-[1.08] max-w-4xl [overflow-wrap:anywhere] sm:[overflow-wrap:normal]"
    style="font-weight: 800"
    >
    <span>{{ title }}</span>
    @if (highlight) {
      {{ ' ' }}<span class="text-[var(--accent)]">{{ highlight }}</span>
    }
  </h2>

  @if (subtitle) {
    <p class="text-[var(--muted)] max-w-2xl leading-relaxed text-[1.05rem] sm:text-lg">
      {{ subtitle }}
    </p>
  }
</div>
