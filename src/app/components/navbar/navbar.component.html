<nav
  class="fixed top-0 w-full z-50 transition-colors duration-300"
  [class.on-dark]="!scrolled && !menuOpen"
  [class]="scrolled || menuOpen
    ? 'bg-[#f3f1ec]/90 backdrop-blur-xl border-b border-[rgba(15,23,32,0.08)]'
    : 'bg-transparent border-b border-transparent'"
  >
  <div class="max-w-content mx-auto px-5 sm:px-8">
    <div class="flex items-center justify-between h-16">
      <button (click)="scrollTo('inicio')" class="flex items-center gap-2.5" type="button">
        <span
          class="grid place-items-center w-8 h-8 rounded-lg bg-[var(--ink)] text-[var(--bg)] font-display text-[0.8rem] transition-colors"
          style="font-weight: 800"
          aria-hidden="true"
          >JH</span>
        <span class="font-display text-[var(--ink)] tracking-tight text-[1.05rem]" style="font-weight: 700">
          Juan Pablo Huerta
        </span>
      </button>

      <div class="hidden lg:flex items-center gap-1">
        @for (link of content.nav.links; track $index) {
          <button
            type="button"
            (click)="scrollTo(link.id)"
            class="relative px-3.5 py-2 text-sm rounded-full transition-colors duration-200"
            [class]="activeSection === link.id
              ? 'text-[var(--ink)] bg-[var(--accent-soft)]'
              : 'text-[var(--muted)] hover:text-[var(--ink)]'"
            >
            {{ link.label }}
          </button>
        }
      </div>

      <div class="hidden lg:flex items-center gap-4">
        <div class="lang-toggle" role="group" aria-label="Idioma / Language">
          <button type="button" [class.is-active]="lang === 'es'" (click)="setLang('es')">ES</button>
          <button type="button" [class.is-active]="lang === 'en'" (click)="setLang('en')">EN</button>
        </div>
        @if (cvHref) {
          <a [href]="cvHref" download class="text-sm text-[var(--muted)] hover:text-[var(--ink)] link-underline">
            {{ content.nav.cv }}
          </a>
        }
        <button type="button" class="btn-primary !py-2.5 !px-4 !text-sm" (click)="scrollTo('contacto')">
          {{ content.nav.contact }}
        </button>
      </div>

      <button
        type="button"
        (click)="menuOpen = !menuOpen"
        class="lg:hidden w-10 h-10 -mr-2 flex items-center justify-center text-[var(--ink)]"
        [attr.aria-label]="content.nav.menuAria"
        [attr.aria-expanded]="menuOpen"
        >
        @if (!menuOpen) {
          <svg lucideMenu class="w-5 h-5"></svg>
        } @else {
          <svg lucideX class="w-5 h-5"></svg>
        }
      </button>
    </div>
  </div>
</nav>

@if (menuOpen) {
  <div class="fixed top-16 left-0 right-0 z-40 bg-[#f3f1ec]/95 backdrop-blur-xl border-b border-[rgba(15,23,32,0.08)] shadow-lg lg:hidden">
    <div class="max-w-content mx-auto px-5 py-4 space-y-1">
      @for (link of content.nav.links; track $index) {
        <button
          type="button"
          (click)="scrollTo(link.id)"
          class="w-full text-left px-2 py-3 text-base transition-colors border-b border-[var(--line)] last:border-0"
          [class]="activeSection === link.id ? 'text-[var(--accent)]' : 'text-[var(--ink)]'"
          >
          {{ link.label }}
        </button>
      }
      <div class="pt-4 flex items-center justify-between gap-3">
        <div class="lang-toggle" role="group" aria-label="Idioma / Language">
          <button type="button" [class.is-active]="lang === 'es'" (click)="setLang('es')">ES</button>
          <button type="button" [class.is-active]="lang === 'en'" (click)="setLang('en')">EN</button>
        </div>
        <div class="flex gap-2">
          @if (cvHref) {
            <a [href]="cvHref" download class="btn-secondary !py-2.5 !px-4 !text-sm">{{ content.nav.cv }}</a>
          }
          <button type="button" (click)="scrollTo('contacto')" class="btn-primary !py-2.5 !px-4 !text-sm">
            {{ content.nav.contact }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
