<nav class="barra" [class.is-scrolled]="scrolled" aria-label="Juan Pablo Huerta">
  <div class="barra__inner">
    <button type="button" class="barra__marca" (click)="scrollTo('inicio')">Juan Pablo Huerta</button>

    <div class="barra__links">
      @for (link of content.nav.links; track $index) {
        <button
          type="button"
          class="barra__link"
          [class.is-active]="activeSection === link.id"
          [attr.aria-current]="activeSection === link.id ? 'true' : null"
          (click)="scrollTo(link.id)"
        >{{ link.label }}</button>
      }
    </div>

    <div class="barra__acciones">
      <div class="idioma" role="group" aria-label="Idioma / Language">
        <button type="button" [class.is-active]="lang === 'es'" [attr.aria-pressed]="lang === 'es'" (click)="setLang('es')">ES</button>
        <button type="button" [class.is-active]="lang === 'en'" [attr.aria-pressed]="lang === 'en'" (click)="setLang('en')">EN</button>
      </div>
      @if (cvHref) {
        <a class="barra__link barra__cv" [href]="cvHref" download="JuanPabloHuerta-CV.pdf">{{ content.nav.cv }}</a>
      }
      <button type="button" class="btn btn--calco btn--chico barra__contacto" (click)="scrollTo('contacto')">{{ content.nav.contact }}</button>
      <button
        type="button"
        class="barra__menu"
        (click)="menuOpen = !menuOpen"
        [attr.aria-label]="content.nav.menuAria"
        [attr.aria-expanded]="menuOpen"
      >
        @if (!menuOpen) {
          <svg lucideMenu class="w-5 h-5"></svg>
        } @else {
          <svg lucideX class="w-5 h-5"></svg>
        }
      </button>
    </div>
  </div>

  @if (menuOpen) {
    <div class="barra__panel">
      @for (link of content.nav.links; track $index) {
        <button type="button" class="barra__panel-link" [class.is-active]="activeSection === link.id" (click)="scrollTo(link.id)">{{ link.label }}</button>
      }
      @if (cvHref) {
        <a class="barra__panel-link" [href]="cvHref" download="JuanPabloHuerta-CV.pdf">{{ content.nav.cv }}</a>
      }
      <button type="button" class="barra__panel-link" (click)="scrollTo('contacto')">{{ content.nav.contact }}</button>
    </div>
  }
</nav>
