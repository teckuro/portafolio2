<nav
  class="nav-bar fixed top-0 w-full z-50"
  [class.nav--solid]="scrolled || menuOpen"
>
  <div class="max-w-content mx-auto px-5 sm:px-8">
    <div class="flex items-center justify-between h-16">
      <button
        (click)="scrollTo('inicio')"
        class="group flex items-baseline gap-1"
        type="button"
      >
        <span class="nav-brand font-display tracking-tight text-[1.05rem]" style="font-weight: 700">
          Juan Pablo Huerta
        </span>
      </button>

      <div class="hidden lg:flex items-center gap-1">
        <button
          *ngFor="let link of navLinks"
          type="button"
          (click)="scrollTo(link.id)"
          class="nav-link relative px-3 py-2 text-[13px] transition-colors duration-200"
          [class.is-active]="activeSection === link.id"
        >
          {{ link.label }}
          <span
            *ngIf="activeSection === link.id"
            class="nav-link-underline absolute left-3 right-3 -bottom-0.5 h-px"
          ></span>
        </button>
      </div>

      <div class="hidden lg:flex items-center gap-4">
        <a
          *ngIf="cvHref"
          [href]="cvHref"
          download
          class="nav-cv text-[13px] link-underline"
        >
          CV
        </a>
        <button
          type="button"
          class="nav-cta px-4 py-2 text-[13px] rounded-md active:translate-y-px transition-all"
          style="font-weight: 500"
          (click)="scrollTo('contacto')"
        >
          Contacto
        </button>
      </div>

      <button
        type="button"
        (click)="menuOpen = !menuOpen"
        class="nav-menu-btn lg:hidden w-9 h-9 flex items-center justify-center"
        aria-label="Abrir menú"
      >
        <lucide-icon *ngIf="!menuOpen" name="menu" class="w-5 h-5"></lucide-icon>
        <lucide-icon *ngIf="menuOpen" name="x" class="w-5 h-5"></lucide-icon>
      </button>
    </div>
  </div>
</nav>

<div *ngIf="menuOpen" class="nav-drawer fixed top-16 left-0 right-0 z-40 lg:hidden">
  <div class="max-w-content mx-auto px-5 py-4 space-y-1">
    <button
      *ngFor="let link of navLinks"
      type="button"
      (click)="scrollTo(link.id)"
      class="nav-drawer-link w-full text-left px-2 py-3 text-sm transition-colors border-b last:border-0"
      [class.is-active]="activeSection === link.id"
    >
      {{ link.label }}
    </button>

    <div class="pt-4 flex gap-3">
      <a
        *ngIf="cvHref"
        [href]="cvHref"
        download
        class="nav-drawer-cv flex-1 py-2.5 text-sm text-center rounded-md"
      >
        Descargar CV
      </a>
      <button
        type="button"
        (click)="scrollTo('contacto')"
        class="nav-drawer-cta flex-1 py-2.5 text-sm rounded-md"
        style="font-weight: 500"
      >
        Contacto
      </button>
    </div>
  </div>
</div>
