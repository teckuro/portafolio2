<footer class="fin">
  <p class="fin__titulo">{{ content.sheet.end }}</p>
  <div class="fin__grid">
    <p class="fin__tagline">{{ content.footer.tagline }}</p>
    <ul class="fin__links" [attr.aria-label]="content.footer.navTitle">
      @for (link of content.nav.links; track $index) {
        <li><button type="button" class="ink-link" (click)="scrollTo(link.id)">{{ link.label }}</button></li>
      }
    </ul>
    <ul class="fin__links" [attr.aria-label]="content.footer.contactTitle">
      @for (link of content.contact.links; track $index) {
        <li>
          <a
            class="ink-link"
            [href]="link.href"
            [attr.target]="link.external ? '_blank' : null"
            [attr.rel]="link.external ? 'noopener noreferrer' : null"
          >{{ link.label }}</a>
        </li>
      }
    </ul>
  </div>
  <p class="fin__derechos">{{ content.footer.rights }}</p>
</footer>
