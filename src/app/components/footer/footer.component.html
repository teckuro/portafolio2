<footer class="band-ink border-t border-[rgba(232,238,243,0.1)]">
  <div class="max-w-content mx-auto px-5 sm:px-8 py-14">
    <div class="grid sm:grid-cols-3 gap-10 mb-12">
      <div>
        <p
          class="font-display text-[var(--ink)] tracking-tight mb-3"
          style="font-weight: 700; font-size: 1.1rem"
        >
          Juan Pablo Huerta
        </p>
        <p class="text-[var(--muted)] text-sm leading-relaxed max-w-xs">
          Full Stack y Analista Programador. Sistemas productivos, integraciones y ERP.
        </p>
      </div>

      <div>
        <p class="text-[11px] uppercase tracking-[0.18em] text-[var(--faint)] mb-4">
          Navegación
        </p>
        <div class="grid grid-cols-2 gap-y-2 gap-x-4">
          <button
            *ngFor="let link of navLinks"
            type="button"
            class="text-left text-sm text-[var(--muted)] hover:text-[var(--accent)] transition-colors"
            (click)="scrollTo(link.id)"
          >
            {{ link.label }}
          </button>
        </div>
      </div>

      <div>
        <p class="text-[11px] uppercase tracking-[0.18em] text-[var(--faint)] mb-4">
          Contacto
        </p>
        <div class="space-y-2 text-sm text-[var(--muted)]">
          <a
            *ngIf="email"
            [href]="'mailto:' + email"
            class="block hover:text-[var(--accent)] transition-colors"
          >{{ email }}</a>
          <a
            *ngIf="phone"
            [href]="'tel:' + phone"
            class="block hover:text-[var(--accent)] transition-colors"
          >{{ phone }}</a>
          <p *ngIf="location">{{ location }}</p>
        </div>
        <div class="flex gap-4 mt-5">
          <a
            *ngIf="githubUrl"
            [href]="githubUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="text-sm text-[var(--muted)] hover:text-[var(--accent)] transition-colors"
          >GitHub</a>
          <a
            *ngIf="linkedinUrl"
            [href]="linkedinUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="text-sm text-[var(--muted)] hover:text-[var(--accent)] transition-colors"
          >LinkedIn</a>
        </div>
      </div>
    </div>

    <div class="pt-8 border-t border-[var(--line)] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
      <p class="text-[var(--faint)] text-xs">© 2026 Juan Pablo Huerta</p>
      <p class="text-[var(--faint)] text-xs">Disponible para nuevas oportunidades</p>
    </div>
  </div>
</footer>
