<nav
  class="fixed top-0 w-full z-50 transition-all duration-500"
  [class]="scrolled
    ? 'bg-[#080B12]/90 backdrop-blur-2xl border-b border-white/[0.06] shadow-2xl shadow-black/40'
    : 'bg-transparent'"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <button
        (click)="scrollTo('inicio')"
        class="flex items-center gap-3 group"
        type="button"
      >
        <div
          class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-violet-500/30 group-hover:shadow-violet-500/50 transition-shadow"
        >
          <lucide-icon name="code-2" class="w-4 h-4 text-white" [strokeWidth]="2"></lucide-icon>
        </div>
        <span class="text-slate-200 tracking-tight" style="font-weight: 600;">
          JP<span class="text-violet-400">.</span>Huerta
        </span>
      </button>

      <div class="hidden lg:flex items-center gap-1">
        <button
          *ngFor="let link of navLinks"
          type="button"
          (click)="scrollTo(link.id)"
          class="relative px-4 py-2 rounded-lg text-sm transition-all duration-200"
          [class]="activeSection === link.id
            ? 'text-white'
            : 'text-slate-400 hover:text-slate-200 hover:bg-white/[0.04]'"
        >
          {{ link.label }}
          <span
            *ngIf="activeSection === link.id"
            class="absolute bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-violet-400"
          ></span>
        </button>
      </div>

      <div class="hidden lg:flex items-center gap-3">
        <button
          type="button"
          class="flex items-center gap-2 px-4 py-2 text-sm text-slate-400 hover:text-slate-200 transition-colors rounded-lg hover:bg-white/[0.04]"
        >
          <lucide-icon name="download" class="w-3.5 h-3.5"></lucide-icon>
          CV
        </button>
        <button
          type="button"
          class="px-5 py-2.5 text-sm rounded-xl bg-gradient-to-r from-violet-600 to-indigo-500 text-white shadow-lg shadow-violet-500/25 hover:shadow-violet-500/40 hover:opacity-90 transition-all"
          style="font-weight: 500;"
          (click)="scrollTo('contacto')"
        >
          Contratar
        </button>
      </div>

      <button
        type="button"
        (click)="menuOpen = !menuOpen"
        class="lg:hidden w-9 h-9 rounded-lg bg-white/[0.05] border border-white/[0.07] flex items-center justify-center text-slate-300 hover:bg-white/[0.08] transition-all"
        aria-label="Abrir menú"
      >
        <lucide-icon *ngIf="!menuOpen" name="menu" class="w-4 h-4"></lucide-icon>
        <lucide-icon *ngIf="menuOpen" name="x" class="w-4 h-4"></lucide-icon>
      </button>
    </div>
  </div>
</nav>

<div
  *ngIf="menuOpen"
  class="fixed top-16 left-0 right-0 z-40 bg-[#080B12]/95 backdrop-blur-2xl border-b border-white/[0.07] shadow-2xl lg:hidden"
>
  <div class="max-w-7xl mx-auto px-4 py-4 space-y-1">
    <button
      *ngFor="let link of navLinks"
      type="button"
      (click)="scrollTo(link.id)"
      class="w-full text-left px-4 py-3 rounded-xl text-sm transition-all"
      [class]="activeSection === link.id
        ? 'bg-violet-500/10 text-violet-300 border border-violet-500/20'
        : 'text-slate-400 hover:text-white hover:bg-white/[0.04]'"
    >
      {{ link.label }}
    </button>

    <div class="pt-3 pb-1 flex gap-3">
      <button
        type="button"
        class="flex-1 py-2.5 text-sm text-slate-400 border border-white/[0.08] rounded-xl hover:bg-white/[0.04] transition-all flex items-center justify-center gap-2"
      >
        <lucide-icon name="download" class="w-3.5 h-3.5"></lucide-icon>
        Descargar CV
      </button>
      <button
        type="button"
        (click)="scrollTo('contacto')"
        class="flex-1 py-2.5 text-sm rounded-xl bg-gradient-to-r from-violet-600 to-indigo-500 text-white"
        style="font-weight: 500;"
      >
        Contratar
      </button>
    </div>
  </div>
</div>
