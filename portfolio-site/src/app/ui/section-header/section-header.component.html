<div class="flex flex-col gap-4 mb-12 sm:mb-16" [ngClass]="alignClass">
  <p
    *ngIf="eyebrow"
    class="text-[11px] uppercase tracking-[0.22em] text-[var(--faint)]"
  >
    {{ eyebrow }}
  </p>

  <h2
    class="font-display text-3xl sm:text-4xl md:text-[2.75rem] tracking-tight text-[var(--ink)] leading-[1.1]"
    style="font-weight: 700"
  >
    <span>{{ title }}</span>
    <ng-container *ngIf="highlight">
      <span> </span>
      <span class="text-[var(--accent)]">{{ highlight }}</span>
    </ng-container>
  </h2>

  <div
    class="h-px w-12 bg-[var(--accent)]"
    [ngClass]="align === 'center' ? 'mx-auto' : ''"
  ></div>

  <p
    *ngIf="subtitle"
    class="text-[var(--muted)] max-w-xl leading-relaxed text-[0.975rem]"
  >
    {{ subtitle }}
  </p>
</div>
